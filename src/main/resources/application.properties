# ── Repository Type ───────────────────────────────────────────────────────────
# Options: cache | database
repository.type=database

# ── H2 Database Configuration (development / test) ────────────────────────────
db.url=jdbc:h2:mem:quantitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.driver=org.h2.Driver
db.username=sa
db.password=

# ── MySQL (commented out – production) ────────────────────────────────────────
# db.url=jdbc:mysql://localhost:3306/quantitydb?useSSL=false&serverTimezone=UTC
# db.driver=com.mysql.cj.jdbc.Driver
# db.username=root
# db.password=yourpassword

# ── PostgreSQL (commented out) ────────────────────────────────────────────────
# db.url=jdbc:postgresql://localhost:5432/quantitydb
# db.driver=org.postgresql.Driver
# db.username=postgres
# db.password=yourpassword

# Connection Pool
#how many connections are managed - 10 
pool.size=10 
pool.connection.timeout=30000

# Logging - controls how much logs you see Levels:
#DEBUG \u2192 very detailed
#INFO \u2192 normal (you selected this)
#ERROR \u2192 only error���
logging.level=INFO
