# HOW TO GET THESE:
#   1. Go to https://console.cloud.google.com/
#   2. Create a project â APIs & Services â Credentials â Create OAuth 2.0 Client ID
#   3. Application type: Web application
#   4. Authorised redirect URI: http://localhost:8080/login/oauth2/code/google
#   5. Copy Client ID and Client Secret below
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ââ OAuth2 redirect URI (where frontend receives the JWT after Google login) 
app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback

# ââ Logging 
